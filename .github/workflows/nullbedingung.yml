# ---------------------------------------------------------------------------
# Zwei Jobs, weil zwei verschiedene Fragen zu beantworten sind.
#
#   nullbedingung      spec.md §34 — läuft `mvn verify` unverändert grün, OHNE
#                      fremde Zugangsdaten? Darf rot sein. Rot IST ein Ergebnis.
#
#   bauen-und-testen   der Job, den die Pipeline benutzt: übersetzt und testet
#                      das Projekt und legt Surefire-XML ab.
#
# WARUM ZWEI JOBS — und warum das keine Trickserei ist
#
#   Am Tag 1.9.0 bindet wrongsecrets `org.owasp:dependency-check-maven:9.2.0`
#   in die verify-Phase. Der Scanner braucht einen NVD-API-Schlüssel und
#   scheitert ohne ihn mit 403/404. Damit steht die Antwort auf §34 fest, und
#   sie ist ROT — nachzulesen in docs/messungen/nullbedingung-wrongsecrets.md
#   im Hauptrepo.
#
#   Einen Schlüssel zu hinterlegen wäre genau das, was §34 ausschließt: dann
#   wäre die Frage nicht beantwortet, sondern umgangen (Issue #18, Falle 2).
#
#   Für alles ab Schritt A brauchen wir aber Surefire-XML. Deshalb der zweite
#   Job mit `-Ddependency-check.skip=true`. Das ist zulässig, weil dieser
#   Scanner in unserem Aufbau ohnehin doppelt ist: die Erkennungsquelle ist
#   Dependency-Track (E2a, spec.md §9), und zwar GENAU EINE. Zwei Scanner mit
#   zwei Datenständen wären kein Gewinn, sondern zwei Wahrheiten.
#
#   Was der Skip kostet, steht im Messprotokoll — er wird nicht verschwiegen.
#
# JDK-VERSION IST FESTGENAGELT, nicht geerbt.
#
#   Am Tag 1.9.0 (08.07.2024) sagt das pom.xml <java.version>22</java.version>
#   bei Spring Boot 3.3.1. Auf dem heutigen Upstream-`main` steht dort 26 — wer
#   von `main` abliest, nagelt den falschen Wert fest (ADR 0009, Risiko 1).
#
# JOB- UND ARTEFAKTNAME SIND SCHNITTSTELLE.
#
#   `bauen-und-testen` und `surefire-xml` — dieselben Namen wie im Hauptrepo.
#   `holePrüfergebnisse(ref)` und `tools/fixtures-ernten.sh` erkennen beides AM
#   NAMEN. Umbenennen bricht die Aufrufer, ohne dass hier etwas rot wird.
# ---------------------------------------------------------------------------
name: build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [mvp-basis]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Die Messung. Unverändert, ohne jeden Schalter, ohne secrets.
  # -------------------------------------------------------------------------
  nullbedingung:
    name: nullbedingung
    runs-on: ubuntu-latest
    # ROT IST HIER EIN ERGEBNIS, kein Scheitern. spec.md §34: A–E und G–L hängen
    # nicht an der Nullbedingung; nur der Migrations-Agent (Rang 6) tut es.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'

      - name: Werkzeugstaende zitieren
        run: |
          mvn -v
          java -version
          echo "pom.xml sagt: $(grep -oE '<java.version>[^<]*' pom.xml)"

      - name: mvn -B verify, unveraendert
        # KEINE secrets, KEIN Skip, KEINE Profile. Genau das ist der Punkt.
        run: mvn -B verify

  # -------------------------------------------------------------------------
  # Der Job, den die Pipeline benutzt.
  # -------------------------------------------------------------------------
  bauen-und-testen:
    name: bauen-und-testen
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'

      - name: Bauen und testen
        # Der eine Schalter, und er ist oben begründet. Sonst nichts.
        run: mvn -B verify -Ddependency-check.skip=true

      - name: Surefire-XML als Artefakt ablegen
        # if: always() — genau der ROTE Lauf ist der, den das Tor aus spec.md §24
        # später vergleicht. Ohne ihn hat es keine Eingabe.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-xml
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: error
          retention-days: 30
