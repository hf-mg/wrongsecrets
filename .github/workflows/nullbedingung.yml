# ---------------------------------------------------------------------------
# Zwei Jobs, weil zwei verschiedene Fragen zu beantworten sind.
#
#   nullbedingung      spec.md §34 — läuft `mvn verify` unverändert grün, OHNE
#                      fremde Zugangsdaten? Darf rot sein. Rot IST ein Ergebnis.
#
#   bauen-und-testen   der Job, den die Pipeline benutzt: übersetzt und testet
#                      das Projekt und legt Surefire-XML ab.
#
# WARUM ZWEI JOBS — und warum das keine Trickserei ist
#
#   Am Tag 1.9.0 bindet wrongsecrets `org.owasp:dependency-check-maven:9.2.0`
#   in die verify-Phase. Der Scanner braucht einen NVD-API-Schlüssel und
#   scheitert ohne ihn mit 403/404. Damit steht die Antwort auf §34 fest, und
#   sie ist ROT — nachzulesen in docs/messungen/nullbedingung-wrongsecrets.md
#   im Hauptrepo.
#
#   Einen Schlüssel zu hinterlegen wäre genau das, was §34 ausschließt: dann
#   wäre die Frage nicht beantwortet, sondern umgangen (Issue #18, Falle 2).
#
#   Für alles ab Schritt A brauchen wir aber Surefire-XML. Deshalb der zweite
#   Job mit `-Ddependency-check.skip=true`. Das ist zulässig, weil dieser
#   Scanner in unserem Aufbau ohnehin doppelt ist: die Erkennungsquelle ist
#   Dependency-Track (E2a, spec.md §9), und zwar GENAU EINE. Zwei Scanner mit
#   zwei Datenständen wären kein Gewinn, sondern zwei Wahrheiten.
#
#   Was der Skip kostet, steht im Messprotokoll — er wird nicht verschwiegen.
#
# JDK-VERSION IST FESTGENAGELT, nicht geerbt.
#
#   Am Tag 1.9.0 (08.07.2024) sagt das pom.xml <java.version>22</java.version>
#   bei Spring Boot 3.3.1. Auf dem heutigen Upstream-`main` steht dort 26 — wer
#   von `main` abliest, nagelt den falschen Wert fest (ADR 0009, Risiko 1).
#
# JOB- UND ARTEFAKTNAME SIND SCHNITTSTELLE.
#
#   `bauen-und-testen` und `surefire-xml` — dieselben Namen wie im Hauptrepo.
#   `holePrüfergebnisse(ref)` und `tools/fixtures-ernten.sh` erkennen beides AM
#   NAMEN. Umbenennen bricht die Aufrufer, ohne dass hier etwas rot wird.
# ---------------------------------------------------------------------------
name: build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [mvp-basis]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Die Messung. Unverändert, ohne jeden Schalter, ohne secrets.
  # -------------------------------------------------------------------------
  nullbedingung:
    name: nullbedingung
    runs-on: ubuntu-latest
    # ROT IST HIER EIN ERGEBNIS, kein Scheitern. spec.md §34: A–E und G–L hängen
    # nicht an der Nullbedingung; nur der Migrations-Agent (Rang 6) tut es.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'

      - name: Werkzeugstaende zitieren
        run: |
          mvn -v
          java -version
          echo "pom.xml sagt: $(grep -oE '<java.version>[^<]*' pom.xml)"

      - name: mvn -B verify, unveraendert
        # KEINE secrets, KEIN Skip, KEINE Profile. Genau das ist der Punkt.
        run: mvn -B verify

  # -------------------------------------------------------------------------
  # Der Job, den die Pipeline benutzt.
  # -------------------------------------------------------------------------
  bauen-und-testen:
    name: bauen-und-testen
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'

      - name: Bauen und testen
        # MECHANISMUS 2 aus spec.md 24.3, gemaessigte Variante (Issue #25):
        # ein verengter Filter im AUFRUF, der noch etwas laufen laesst.
        #
        # Die scharfe Variante (-Dgroups=langsam, Zweig mech-2-gruppenfilter)
        # liess NULL Tests laufen - und Maven meldete BUILD SUCCESS. Dann gibt
        # es gar kein Surefire-XML mehr, und der Inventurvergleich hat keine
        # Eingabe. Damit auch der VERGLEICH vorgefuehrt werden kann, laeuft hier
        # eine Teilmenge weiter.
        #
        # Keine Testdatei und keine POM-Zeile angefasst. Nur der Aufruf.
        run: mvn -B verify -Ddependency-check.skip=true -Dtest='Challenge*Test'

      - name: Surefire-XML als Artefakt ablegen
        # if: always() — genau der ROTE Lauf ist der, den das Tor aus spec.md §24
        # später vergleicht. Ohne ihn hat es keine Eingabe.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-xml
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: error
          retention-days: 30

      # -----------------------------------------------------------------------
      # SBOM: DIE DATEI ZUERST. (spec.md §8.2, Prüfung 25)
      #
      #   "Die SBOM-Datei wird ZUERST in eine dauerhafte Ablage geschrieben und
      #    DANACH nach Dependency-Track geladen. Widersprechen sich die beiden,
      #    gewinnt die Datei."
      #
      # Die Reihenfolge ist hier nicht Konvention, sondern Bauform: der Upload
      # (#34) läuft in einem eigenen Job, der `needs: bauen-und-testen` trägt und
      # das Artefakt `sbom` herunterlädt. Er kann gar nicht vor der Ablage
      # laufen, weil es vorher nichts zum Herunterladen gibt.
      #
      # Die Datei ist das Archiv. Dependency-Track ist die Abfrageschicht darüber
      # und ersetzbar (§8.2).
      # -----------------------------------------------------------------------
      - name: SBOM in die Ablage schreiben
        # if: always() — auch aus einem roten Lauf ist die Stückliste Nachweis.
        if: always()
        run: |
          set -u
          mkdir -p sbom-ablage
          KURZ="${GITHUB_SHA:0:12}"

          # FALLE, erlitten in Lauf 33148396220: das Dokument liegt NICHT unter
          # target/bom.json, obwohl das pom.xml <outputName>bom</outputName>
          # sagt. Es landet unter
          #     target/classes/META-INF/sbom/application.cdx.json
          # weil spring-boot-starter-parent 3.3.1 eigene Vorgaben für das
          # cyclonedx-Plugin mitbringt und diese sich durchsetzen.
          #
          # Deshalb wird gesucht statt geraten. Ein fester Pfad hätte hier still
          # "keine SBOM" gemeldet, obwohl 373 Komponenten erzeugt worden waren -
          # genau die Sorte Fehler, die wie ein Ergebnis aussieht.
          echo "Gefundene BOM-Dateien im Baum:"
          find target -type f \( -name '*.cdx.json' -o -name '*.cdx.xml' \
                                 -o -name 'bom.json' -o -name 'bom.xml' \) \
               -not -path '*/sbom-ablage/*' | sed 's/^/  /'

          # EIN Dokument je Lauf, benannt nach Commit (spec.md §8.1: mehrere BOMs
          # je Projektversion sind ausdrücklich nicht der Weg). Bei mehreren
          # Treffern derselben Endung gewinnt der erste - und die Liste oben
          # zeigt, ob es überhaupt mehrere gab.
          GEFUNDEN=0
          for ENDUNG in json xml; do
            QUELLE=$(find target -type f \( -name "*.cdx.$ENDUNG" -o -name "bom.$ENDUNG" \) \
                     | head -1)
            [ -n "$QUELLE" ] || continue
            cp "$QUELLE" "sbom-ablage/wrongsecrets-${KURZ}.cdx.${ENDUNG}"
            GEFUNDEN=$((GEFUNDEN + 1))
          done

          if [ "$GEFUNDEN" -eq 0 ]; then
            # WARNEN, NICHT SCHEITERN (spec.md §8.3): im Piloten wird nichts
            # ausgeliefert, also blockiert eine fehlende SBOM den Lauf nicht.
            # Sichtbar muss sie trotzdem sein - deshalb eine echte Annotation
            # und keine Logzeile, die im Rauschen untergeht.
            echo "::warning title=SBOM fehlt::Der CycloneDX-Schritt hat kein Dokument erzeugt. Im Piloten wird nichts ausgeliefert (spec.md 8.3), deshalb warnt dieser Schritt und bricht nicht ab. Der Upload-Job (#34) MUSS daran scheitern."
            echo "SBOM_VORHANDEN=nein" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "SBOM_VORHANDEN=ja" >> "$GITHUB_ENV"
          echo "In der Ablage, vor jedem Upload:"
          ls -l sbom-ablage/ | sed 's/^/  /'
          echo
          echo "Erste 400 Zeichen des Dokuments:"
          head -c 400 "sbom-ablage/wrongsecrets-${KURZ}.cdx.json" 2>/dev/null | sed 's/^/  /'

      - name: V8 messen — scope und transitive Komponenten
        if: always() && env.SBOM_VORHANDEN == 'ja'
        run: |
          set -u
          KURZ="${GITHUB_SHA:0:12}"
          F="sbom-ablage/wrongsecrets-${KURZ}.cdx.json"
          echo "=== V8: spec.md §35 — Scope und transitive Komponenten? ==="
          echo "specVersion : $(grep -oE '\"specVersion\"[ ]*:[ ]*\"[^\"]+\"' "$F" | head -1)"
          echo "Komponenten : $(grep -o '\"purl\"' "$F" | wc -l)"
          echo "mit scope   : $(grep -o '\"scope\"' "$F" | wc -l)"
          echo "scope-Werte : $(grep -oE '\"scope\"[ ]*:[ ]*\"[^\"]+\"' "$F" | sort | uniq -c | tr '\n' ' ')"
          echo "dependencies-Block vorhanden: $(grep -c '\"dependencies\"' "$F")"
          echo
          echo "=== Erste drei Komponenten, vollstaendig ==="
          tr ',' '\n' < "$F" | grep -E '\"(group|name|version|purl|scope)\"' | head -18 | sed 's/^/  /'

      - name: SBOM als Artefakt ablegen
        if: always() && env.SBOM_VORHANDEN == 'ja'
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-ablage/
          if-no-files-found: error
          retention-days: 90
